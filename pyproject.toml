[project]
name = "automl-ai-assistant-usage-in-student-life"
version = "0.1.0"
description = "PyCaret AutoML study of AI-assistant usage in student life (predicting session reuse)."
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "nbconvert>=7.16.6",
    "numpy==1.26.4",
    "pandas==2.1.4",
    "pycaret==3.3.2",
    "scikit-learn==1.4.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]
